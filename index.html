    const Icon = ({ name, size = 18, className = "" }) => {
      const ref = React.useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.setAttribute('class', className);
          ref.current.appendChild(i);
          window.lucide.createIcons({ root: ref.current });
        }
      }, [name, size, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" />;
    };

        try {
          localStorage.setItem('bengkelpro_html_loggedInUser', JSON.stringify(loggedInUser));

          localStorage.setItem('bengkelpro_html_payslips', JSON.stringify(payslips));
          localStorage.setItem('bengkelpro_html_leaves', JSON.stringify(leaves));
          localStorage.setItem('bengkelpro_html_claims', JSON.stringify(claims));

        setGlobalToast(msg);
        setTimeout(() => setGlobalToast(''), 3500);

      const logAuditEvent = (action, target, details) => {
        const now = new Date();

      };

      const isUnderManagerHierarchy = (managerEmpId, targetEmpId) => {
        if (!managerEmpId || !targetEmpId || managerEmpId === targetEmpId) return false;
        let curr = employees.find(e => e.id === targetEmpId);
        const visited = new Set();
        while (curr && curr.managerId && !visited.has(curr.id)) {
          if (curr.managerId === managerEmpId) return true;
          visited.add(curr.id);
          curr = employees.find(e => e.id === curr.managerId);
        }
        return false;
      };

      const canApproveForEmployee = (targetEmpId) => {
        if (currentRole === 'Super Admin' || currentRole === 'HR Admin') return true;
        if (currentRole === 'Manager / Supervisor') return isUnderManagerHierarchy(activeEmployeeRecord.id, targetEmpId);
        return false;
      };

          setLoginError('Invalid company email or password.');
          return;
        }

          setLoginError('Account is inactive. Contact HR Admin.');
          return;
        }

        const allowed = roleNavMap[matched.systemRole] || ['emp-dashboard'];

              <div className="bg-white p-6 rounded-2xl border border-gray-200 grid grid-cols-2 gap-4 text-xs">
                <div><span className="text-gray-400 block">Employee ID</span><strong>{u.id}</strong></div>
                <div><span className="text-gray-400 block">IC / Passport</span><strong>{u.ic}</strong></div>
                <div><span className="text-gray-400 block">Company Email</span><strong>{u.workEmail}</strong></div>
                <div><span className="text-gray-400 block">Bank Account</span><strong>{u.bankName} ({u.bankAccount})</strong></div>
              </div>
            </div>
          );
        }

        if (activeTab === 'emp-leave') {
          const myLeaves = leaves.filter(l => l.empId === activeEmployeeRecord.id);
          return (
            <div className="space-y-6">
              <div className="flex justify-between items-center">
                <h2 className="text-2xl font-bold text-gray-900">My Leave Applications</h2>
                <button onClick={() => setEmpLeaveModal(true)} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold">+ Apply Leave</button>
              </div>
              <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-gray-50 border-b border-gray-200 text-xs text-gray-500 uppercase font-semibold">
                      <th className="p-4">Leave Type</th>
                      <th className="p-4">Dates</th>
                      <th className="p-4">Days</th>
                      <th className="p-4">Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {myLeaves.map(l => (
                      <tr key={l.id}>
                        <td className="p-4 font-bold text-sm">{l.type}</td>
                        <td className="p-4 text-xs">{l.startDate} to {l.endDate}</td>
                        <td className="p-4 text-xs font-bold">{l.days}d</td>
                        <td className="p-4"><span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700">{l.status}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {empLeaveModal && (
                <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={() => setEmpLeaveModal(false)}>
                  <div className="bg-white rounded-2xl p-6 w-full max-w-md space-y-4" onClick={e => e.stopPropagation()}>
                    <h3 className="font-bold">Apply Leave</h3>
                    <select value={newLeaveReq.type} onChange={e => setNewLeaveReq({ ...newLeaveReq, type: e.target.value })} className="w-full px-3 py-2 border rounded-xl text-sm">
                      {leaveTypes.map(lt => <option key={lt.id} value={lt.name}>{lt.name}</option>)}
                    </select>
                    <div className="grid grid-cols-2 gap-2">
                      <input type="date" value={newLeaveReq.startDate} onChange={e => setNewLeaveReq({ ...newLeaveReq, startDate: e.target.value })} className="px-3 py-2 border rounded-xl text-sm" />
                      <input type="date" value={newLeaveReq.endDate} onChange={e => setNewLeaveReq({ ...newLeaveReq, endDate: e.target.value })} className="px-3 py-2 border rounded-xl text-sm" />
                    </div>
                    <input type="text" placeholder="Reason" value={newLeaveReq.reason} onChange={e => setNewLeaveReq({ ...newLeaveReq, reason: e.target.value })} className="w-full px-3 py-2 border rounded-xl text-sm" />
                    <div className="flex justify-end gap-2">
                      <button onClick={() => setEmpLeaveModal(false)} className="px-4 py-2 border rounded-xl text-xs">Cancel</button>
                      <button onClick={() => { setLeaves([{ id: Date.now(), empId: activeEmployeeRecord.id, empName: activeEmployeeRecord.name, ...newLeaveReq, status: 'Pending' }, ...leaves]); setEmpLeaveModal(false); showToast('Leave submitted!'); }} className="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Submit</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        if (activeTab === 'emp-payroll') {
          const myPayslips = payslips.filter(p => p.empId === activeEmployeeRecord.id);
          return (
            <div className="space-y-6">
              <h2 className="text-2xl font-bold text-gray-900">My Payslips</h2>
              <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-gray-50 border-b border-gray-200 text-xs text-gray-500 uppercase font-semibold">
                      <th className="p-4">Month</th>
                      <th className="p-4">Basic</th>
                      <th className="p-4">Net Pay</th>
                      <th className="p-4 text-right">Download</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {myPayslips.map(p => (
                      <tr key={p.id}>
                        <td className="p-4 font-bold text-sm">{p.month}</td>
                        <td className="p-4 text-sm">RM {formatMoney(p.basic)}</td>
                        <td className="p-4 font-bold text-sm text-emerald-700">RM {formatMoney(p.netPay)}</td>
                        <td className="p-4 text-right"><button onClick={() => showToast(`Downloading ${p.fileName}...`)} className="px-3 py-1 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold">Download PDF</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          );
        }

        if (activeTab === 'emp-claims') {
          const myClaims = claims.filter(c => c.empId === activeEmployeeRecord.id);
          return (
            <div className="space-y-6">
              <div className="flex justify-between items-center">
                <h2 className="text-2xl font-bold text-gray-900">My Expense Claims</h2>
                <button onClick={() => setEditingClaim({ refNo: `CLM-2026-${Math.floor(1000 + Math.random() * 9000)}`, type: 'Mileage, Toll & Petrol', amount: '', remarks: '' })} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold">+ Submit Claim</button>
              </div>
              <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-gray-50 border-b border-gray-200 text-xs text-gray-500 uppercase font-semibold">
                      <th className="p-4">Ref No</th>
                      <th className="p-4">Category</th>
                      <th className="p-4">Amount</th>
                      <th className="p-4">Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {myClaims.map(c => (
                      <tr key={c.id}>
                        <td className="p-4 font-mono text-xs font-bold">{c.refNo}</td>
                        <td className="p-4 text-sm">{c.type}</td>
                        <td className="p-4 font-bold text-sm">RM {formatMoney(c.amount)}</td>
                        <td className="p-4"><span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700">{c.status}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {editingClaim && (
                <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={() => setEditingClaim(null)}>
                  <div className="bg-white rounded-2xl p-6 w-full max-w-md space-y-4" onClick={e => e.stopPropagation()}>
                    <h3 className="font-bold">Submit Expense Claim ({editingClaim.refNo})</h3>
                    <select value={editingClaim.type} onChange={e => setEditingClaim({ ...editingClaim, type: e.target.value })} className="w-full px-3 py-2 border rounded-xl text-sm">
                      {claimPolicies.map(p => <option key={p.id} value={p.category}>{p.category}</option>)}
                    </select>
                    <input type="number" placeholder="Amount (RM)" value={editingClaim.amount} onChange={e => setEditingClaim({ ...editingClaim, amount: e.target.value })} className="w-full px-3 py-2 border rounded-xl text-sm" />
                    <input type="text" placeholder="Remarks" value={editingClaim.remarks} onChange={e => setEditingClaim({ ...editingClaim, remarks: e.target.value })} className="w-full px-3 py-2 border rounded-xl text-sm" />
                    <div className="flex justify-end gap-2">
                      <button onClick={() => setEditingClaim(null)} className="px-4 py-2 border rounded-xl text-xs">Cancel</button>
                      <button onClick={() => { setClaims([{ id: Date.now(), refNo: editingClaim.refNo, empId: activeEmployeeRecord.id, empName: activeEmployeeRecord.name, department: activeEmployeeRecord.department, branch: activeEmployeeRecord.location, type: editingClaim.type, amount: Number(editingClaim.amount), remarks: editingClaim.remarks, submissionDate: new Date().toISOString().split('T')[0], monthYear: '2026-11', status: 'Pending' }, ...claims]); setEditingClaim(null); showToast('Claim submitted!'); }} className="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Submit</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        return null;
      };

      return (
        <div className="min-h-screen flex bg-[#F8FAFC]">
          <aside className={`${sidebarOpen ? 'w-64' : 'w-20'} bg-white border-r border-slate-200 transition-all flex flex-col shrink-0`}>
            <div className="h-16 px-4 flex items-center justify-between border-b border-slate-100">
              {sidebarOpen && <span className="font-extrabold text-slate-900">BengkelPro HRMS</span>}
              <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100">
                <Icon name="menu" size={18} />
              </button>
            </div>
            <nav className="flex-1 p-3 space-y-4 overflow-y-auto">
              {adminNavIds.length > 0 && (
                <div className="space-y-1">
                  {sidebarOpen && <p className="px-3 text-[10px] font-bold uppercase text-slate-400">Management Portal</p>}
                  {adminNavIds.map(id => {
                    const item = navItems[id];
                    return (
                      <button key={id} onClick={() => setActiveTab(id)} className={`w-full flex items-center px-3 py-2 rounded-xl text-xs font-semibold ${activeTab === id ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'}`}>
                        <Icon name={item.icon} size={16} className={sidebarOpen ? 'mr-2.5' : 'mx-auto'} />
                        {sidebarOpen && <span>{item.label}</span>}
                      </button>
                    );
                  })}
                </div>
              )}
              {empNavIds.length > 0 && (
                <div className="space-y-1">
                  {sidebarOpen && <p className="px-3 text-[10px] font-bold uppercase text-slate-400">Employee Self-Service</p>}
                  {empNavIds.map(id => {
                    const item = navItems[id];
                    return (
                      <button key={id} onClick={() => setActiveTab(id)} className={`w-full flex items-center px-3 py-2 rounded-xl text-xs font-semibold ${activeTab === id ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'}`}>
                        <Icon name={item.icon} size={16} className={sidebarOpen ? 'mr-2.5' : 'mx-auto'} />
                        {sidebarOpen && <span>{item.label}</span>}
                      </button>
                    );
                  })}
                </div>
              )}
            </nav>
            {sidebarOpen && (
              <div className="p-3 border-t border-slate-100 space-y-2">
                <div className="p-2.5 rounded-xl bg-slate-50 border border-slate-200/70">
                  <p className="text-xs font-bold text-slate-900 truncate">{activeEmployeeRecord.name}</p>
                  <p className="text-[11px] font-semibold text-blue-600">{currentRole}</p>
                </div>
                <button onClick={() => setLoggedInUser(null)} className="w-full py-2 rounded-xl text-xs font-bold text-rose-600 hover:bg-rose-50">
                  Sign Out
                </button>
              </div>
            )}
          </aside>

          <div className="flex-1 flex flex-col min-w-0">
            <header className="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between sticky top-0 z-30">
              <span className="font-bold text-sm text-slate-900">{navItems[activeTab]?.label}</span>
              <div className="flex items-center gap-3">
                <span className="px-3 py-1 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold">
                  Role: {currentRole}
                </span>
                <button onClick={() => setLoggedInUser(null)} className="px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:text-rose-600">
                  Sign Out
                </button>
              </div>
            </header>

            {globalToast && (
              <div className="mx-6 mt-4 bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 rounded-xl text-xs font-bold">
                {globalToast}
              </div>
            )}

            <main className="flex-1 p-6 max-w-7xl w-full mx-auto">
              {renderContent()}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
